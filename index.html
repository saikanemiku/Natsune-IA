<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Natsune IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #020408;
      --bg-sidebar: #070a10;
      --bg-surface: #0d121c;
      --bg-surface-hover: #151c2c;
      --text-primary: #f1f5f9;
      --text-secondary: #8b9bb4;
      --cyan-neon: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.55);
      --blue-deep: rgba(6, 78, 115, 0.3);
      --danger: #ff5c5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(ellipse 90% 50% at 50% 100%, var(--blue-deep) 0%, rgba(0, 180, 216, 0.09) 45%, transparent 75%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      height: 64px;
      flex-shrink: 0;
      z-index: 30;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }

    .icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-btn:hover, .icon-btn:active {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 242, 254, 0.45);
    }

    .pill-dropdown {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .pill-dropdown:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 242, 254, 0.45);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: 2px solid rgba(0, 242, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.5);
    }

    /* Dropdowns & Popovers */
    .dropdown-menu {
      position: absolute;
      top: 48px;
      background: #0b1019;
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 16px;
      padding: 8px;
      min-width: 225px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.9);
      z-index: 80;
    }

    .dropdown-menu.open {
      display: flex;
      animation: popIn 0.16s ease-out;
    }

    .dropdown-menu.left { left: 48px; }
    .dropdown-menu.right { right: 0; min-width: 290px; padding: 14px; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dropdown-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-primary);
      transition: background-color 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(0, 242, 254, 0.14);
    }

    .dropdown-item small {
      display: block;
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 10px;
    }

    .profile-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .profile-input-group label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .profile-input {
      background: #131a28;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .profile-input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: rgba(0, 242, 254, 0.12);
      border-color: rgba(0, 242, 254, 0.4);
    }

    .save-profile-btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }

    .chat-viewport {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 0 18px;
      scroll-behavior: smooth;
    }

    .chat-viewport::-webkit-scrollbar {
      width: 5px;
    }

    .chat-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .main-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding-bottom: 24px;
    }

    .center-logo-glow {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      overflow: hidden;
      filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.5));
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .center-logo-glow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 26px rgba(0, 242, 254, 0.75)); }
    }

    .center-greeting {
      font-family: 'Outfit', sans-serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      max-width: 460px;
    }

    .messages-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      gap: 20px;
      padding: 12px 0 20px;
    }

    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .user-bubble {
      background: #111a2c;
      border: 1px solid rgba(0, 242, 254, 0.28);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 20px 20px 4px 20px;
      max-width: 82%;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .user-bubble img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 10px;
      margin-bottom: 6px;
      display: block;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--cyan-neon);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 6px;
    }

    .ai-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #05080e;
      border: 1px solid rgba(0, 242, 254, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .ai-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-avatar.spinning svg,
    .ai-avatar.spinning img {
      animation: spin 1.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ai-bubble {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
      padding-top: 4px;
      word-break: break-word;
    }

    .code-snippet-box {
      background: #080c14;
      border: 1px solid rgba(0, 242, 254, 0.22);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
      font-family: monospace;
      font-size: 12.5px;
      color: #a5f3fc;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }

    .attachment-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #0e1522;
      border-radius: 14px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid rgba(0, 242, 254, 0.35);
    }

    .attachment-preview img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 8px;
    }

    .attachment-preview span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .remove-attach-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-primary);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-attach-btn:hover {
      background: rgba(255, 92, 92, 0.25);
      color: var(--danger);
    }

    .bottom-input-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 16px 18px;
      flex-shrink: 0;
      position: relative;
      z-index: 30;
    }

    .floating-prompt-box {
      background-color: #0d121c;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 6px 10px 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }

    .floating-prompt-box:focus-within {
      background-color: #0b101a;
      border-color: var(--cyan-neon);
      box-shadow: 
        0 0 0 2px rgba(0, 242, 254, 0.3),
        0 0 24px rgba(0, 242, 254, 0.7),
        0 0 44px rgba(0, 180, 216, 0.4);
    }

    .tool-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .tool-icon-btn:hover, .tool-icon-btn:active {
      background: rgba(0, 242, 254, 0.14);
      color: var(--cyan-neon);
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.4;
      padding: 8px 4px;
      min-width: 0;
    }

    .prompt-input::placeholder {
      color: var(--text-secondary);
    }

    .action-right-btn {
      background: #182236;
      color: #7dd3fc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 242, 254, 0.25);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .action-right-btn.send-ready {
      background: var(--cyan-neon);
      color: #020610;
      border-color: var(--cyan-neon);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.7);
    }

    .action-right-btn:active {
      transform: scale(0.93);
    }

    .attach-popover {
      position: absolute;
      bottom: 78px;
      left: 18px;
      background: #0b1019;
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.9);
      z-index: 80;
      min-width: 210px;
    }

    .attach-popover.open {
      display: flex;
      animation: popIn 0.15s ease-out;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 295px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-right: 1px solid rgba(0, 242, 254, 0.18);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-shadow: 8px 0 36px rgba(0, 0, 0, 0.9);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      font-weight: 600;
      color: #fff;
    }

    .new-chat-sidebar-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.35);
      color: var(--cyan-neon);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background 0.2s;
    }

    .new-chat-sidebar-btn:hover {
      background: rgba(0, 242, 254, 0.2);
    }

    .history-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .history-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
    }

    .history-bulk-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bulk-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bulk-btn:hover {
      color: #fff;
      border-color: rgba(0, 242, 254, 0.4);
    }

    .bulk-btn.danger {
      background: rgba(255, 92, 92, 0.14);
      border-color: rgba(255, 92, 92, 0.35);
      color: var(--danger);
      display: none;
    }

    .bulk-btn.danger.visible {
      display: inline-block;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s, opacity 0.2s, transform 0.2s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .chat-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--cyan-neon);
      cursor: pointer;
      display: none;
      flex-shrink: 0;
    }

    .history-list.select-mode .chat-checkbox {
      display: block;
    }

    .history-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .delete-chat-btn:hover {
      color: var(--danger);
      background: rgba(255, 92, 92, 0.15);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Reusable SVG Definition for Natsune IA Logo -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <g id="natsune-logo-shape">
        <path fill="currentColor" fill-rule="evenodd" d="M35.5 22 L64.5 22 L82 40.5 L82 59.5 L64.5 78 L35.5 78 L18 59.5 L18 40.5 Z M50 32 A18 18 0 1 0 50 68 A18 18 0 1 0 50 32 Z" />
        <path fill="currentColor" fill-rule="evenodd" d="M50 35.5 A14.5 14.5 0 1 0 50 64.5 A14.5 14.5 0 1 0 50 35.5 Z M50 39 A11 11 0 1 0 50 61 A11 11 0 1 0 50 39 Z" />
        <path fill="currentColor" d="M43 22 C58 14, 77 16, 86 24 C73 19, 57 19, 46 22 Z" />
        <path fill="currentColor" d="M55 22 C70 18, 86 23, 91 34 C83 27, 70 23, 58 24 Z" />
        <path fill="currentColor" d="M66 25 C79 25, 90 33, 90 45 C86 36, 78 30, 68 29 Z" />
        <path fill="currentColor" d="M57 78 C42 86, 23 84, 14 76 C27 81, 43 81, 54 78 Z" />
        <path fill="currentColor" d="M45 78 C30 82, 14 77, 9 66 C17 73, 30 77, 42 76 Z" />
        <path fill="currentColor" d="M34 75 C21 75, 10 67, 10 55 C14 64, 22 70, 32 71 Z" />
      </g>
    </defs>
  </svg>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Hidden File Inputs -->
  <input type="file" id="fileInputSelector" style="display: none;" />
  <input type="file" id="userAvatarSelector" accept="image/*" style="display: none;" />
  <input type="file" id="aiAvatarSelector" accept="image/*" style="display: none;" />

  <!-- Sidebar Drawer -->
  <aside class="sidebar" id="sidebar">
    <div style="display:flex; flex-direction:column; height:100%;">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span id="sidebarBrandLogo" style="display:flex; align-items:center; color: var(--cyan-neon);">
            <svg width="24" height="24" viewBox="0 0 100 100">
              <use href="#natsune-logo-shape"></use>
            </svg>
          </span>
          <span>Natsune IA</span>
        </div>
        <button type="button" class="icon-btn" id="closeSidebar" aria-label="Cerrar menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <button type="button" class="new-chat-sidebar-btn" id="newChatBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Nuevo chat</span>
      </button>

      <div class="history-header-bar">
        <span class="history-label">Recientes</span>
        <div class="history-bulk-actions">
          <button type="button" class="bulk-btn danger" id="deleteSelectedBtn">Borrar (<span id="selectedCount">0</span>)</button>
          <button type="button" class="bulk-btn" id="toggleSelectModeBtn">Seleccionar</button>
        </div>
      </div>

      <div class="history-list" id="historyList"></div>
    </div>
  </aside>

  <!-- Top Header -->
  <header class="top-bar">
    <div class="top-left">
      <button type="button" class="icon-btn" id="menuBtn" title="Menú" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button type="button" class="pill-dropdown" id="modelSelectBtn">
        <span id="currentModelName">Natsune Plus</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Model Dropdown Menu -->
      <div class="dropdown-menu left" id="modelDropdown">
        <div class="dropdown-item" data-model="Natsune Plus">
          <div>
            <strong>Natsune Plus</strong>
            <small>Razonamiento avanzado y análisis</small>
          </div>
        </div>
        <div class="dropdown-item" data-model="Natsune Core">
          <div>
            <strong>Natsune Core</strong>
            <small>El modelo más rápido</small>
          </div>
        </div>
        <div class="dropdown-item" data-model="Natsune A-Z">
          <div>
            <strong>Natsune A-Z</strong>
            <small>El clásico equilibrado</small>
          </div>
        </div>
      </div>
    </div>

    <div class="top-right">
      <!-- Natsune IA Official Logo Button (Fixed branding) -->
      <button type="button" class="icon-btn" id="aiProfileBtn" title="Natsune IA Oficial" style="cursor: default;">
        <svg width="22" height="22" viewBox="0 0 100 100">
          <use href="#natsune-logo-shape"></use>
        </svg>
      </button>

      <!-- User Profile Button -->
      <div class="user-avatar" id="profileBtn" title="Tu perfil">
        <span id="avatarInitial">S</span>
      </div>

      <!-- Functional Profile Popover -->
      <div class="dropdown-menu right" id="profileDropdown">
        <div class="profile-header">
          <div class="user-avatar" style="width:40px; height:40px; cursor:default;" id="popoverAvatar">S</div>
          <div>
            <div style="font-weight:600; font-size:14px;" id="profileDisplayName">Sally</div>
            <div style="font-size:12px; color:var(--cyan-neon);">Perfil personalizable</div>
          </div>
        </div>
        <div class="profile-input-group">
          <label for="userNameInput">Tu nombre</label>
          <input type="text" id="userNameInput" class="profile-input" value="Sally" maxlength="24" />
        </div>
        <div class="profile-input-group">
          <label for="apiKeyInput">API Key de Groq (Privada)</label>
          <input type="password" id="apiKeyInput" class="profile-input" placeholder="gsk_..." />
        </div>
        <div class="profile-input-group">
          <label>Foto de perfil personal</label>
          <button type="button" class="btn-secondary" id="changeUserPhotoBtn">Cambiar tu foto de perfil</button>
        </div>
        <button type="button" class="save-profile-btn" id="saveProfileBtn">Guardar cambios</button>
      </div>
    </div>
  </header>

  <!-- Scrollable Chat / Welcome Viewport -->
  <div class="chat-viewport" id="chatViewport">
    <!-- Center Assistant Screen -->
    <main class="main-center" id="welcomeScreen">
      <div class="center-logo-glow" id="centerAiAvatar">
        <svg width="56" height="56" viewBox="0 0 100 100">
          <use href="#natsune-logo-shape"></use>
        </svg>
      </div>

      <h1 class="center-greeting" id="greetingText">¿Cómo puedo ayudarte, Sally?</h1>
    </main>

    <!-- Conversation Stream -->
    <div class="messages-container" id="messagesContainer"></div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="bottom-input-container">
    <!-- Attached Preview Box -->
    <div class="attachment-preview" id="attachmentPreview">
      <img id="previewThumb" src="" alt="Vista previa" />
      <span id="previewName">archivo</span>
      <button type="button" class="remove-attach-btn" id="removeAttachBtn" title="Quitar">&times;</button>
    </div>

    <!-- Attach Menu Popover -->
    <div class="attach-popover" id="attachPopover">
      <div class="dropdown-item" id="optUploadImage">
        <span>Subir imagen</span>
      </div>
      <div class="dropdown-item" id="optUploadFile">
        <span>Subir archivo para leer</span>
      </div>
    </div>

    <div class="floating-prompt-box" id="promptBox">
      <button type="button" class="tool-icon-btn" id="attachBtn" title="Subir archivo o imagen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <input 
        type="text" 
        class="prompt-input" 
        id="promptInput" 
        placeholder="Pedir a Natsune IA"
        autocomplete="off"
        enterkeyhint="send"
      />

      <button type="button" class="tool-icon-btn" id="micBtn" title="Dictado por voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button type="button" class="action-right-btn" id="sendOrWaveBtn" title="Enviar o Modo Voz">
        <svg id="waveIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="19" x2="18" y2="5"></line>
          <line x1="12" y1="16" x2="12" y2="8"></line>
          <line x1="6" y1="14" x2="6" y2="10"></line>
        </svg>
        <svg id="sendIcon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- CONEXIÓN CON EL CEREBRO SEPARADO (brain.js) -->
  <script src="brain.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const brain = window.natsuneBrain;

      // DOM Elements
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuBtn = document.getElementById('menuBtn');
      const closeSidebar = document.getElementById('closeSidebar');
      const newChatBtn = document.getElementById('newChatBtn');
      const historyList = document.getElementById('historyList');
      const toggleSelectModeBtn = document.getElementById('toggleSelectModeBtn');
      const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
      const selectedCountSpan = document.getElementById('selectedCount');

      const modelSelectBtn = document.getElementById('modelSelectBtn');
      const modelDropdown = document.getElementById('modelDropdown');
      const currentModelName = document.getElementById('currentModelName');

      const profileBtn = document.getElementById('profileBtn');
      const profileDropdown = document.getElementById('profileDropdown');
      const userNameInput = document.getElementById('userNameInput');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const profileDisplayName = document.getElementById('profileDisplayName');
      const popoverAvatar = document.getElementById('popoverAvatar');
      const greetingText = document.getElementById('greetingText');

      const changeUserPhotoBtn = document.getElementById('changeUserPhotoBtn');
      const saveProfileBtn = document.getElementById('saveProfileBtn');
      const userAvatarSelector = document.getElementById('userAvatarSelector');

      const attachBtn = document.getElementById('attachBtn');
      const attachPopover = document.getElementById('attachPopover');
      const optUploadImage = document.getElementById('optUploadImage');
      const optUploadFile = document.getElementById('optUploadFile');
      const fileInputSelector = document.getElementById('fileInputSelector');

      const attachmentPreview = document.getElementById('attachmentPreview');
      const previewThumb = document.getElementById('previewThumb');
      const previewName = document.getElementById('previewName');
      const removeAttachBtn = document.getElementById('removeAttachBtn');

      const promptBox = document.getElementById('promptBox');
      const promptInput = document.getElementById('promptInput');
      const micBtn = document.getElementById('micBtn');
      const sendOrWaveBtn = document.getElementById('sendOrWaveBtn');
      const waveIcon = document.getElementById('waveIcon');
      const sendIcon = document.getElementById('sendIcon');

      const welcomeScreen = document.getElementById('welcomeScreen');
      const messagesContainer = document.getElementById('messagesContainer');
      const chatViewport = document.getElementById('chatViewport');

      let currentAttachment = null;
      let selectMode = false;

      function renderUserIdentity() {
        userNameInput.value = brain.userName;
        if (brain.apiKey) {
          apiKeyInput.value = brain.apiKey;
        }
        profileDisplayName.textContent = brain.userName;
        greetingText.textContent = `¿Cómo puedo ayudarte, ${brain.userName}?`;
        const initial = brain.userName.charAt(0).toUpperCase();

        if (brain.userAvatar) {
          profileBtn.innerHTML = `<img src="${brain.userAvatar}" alt="Usuario" />`;
          popoverAvatar.innerHTML = `<img src="${brain.userAvatar}" alt="Usuario" />`;
        } else {
          profileBtn.innerHTML = `<span>${initial}</span>`;
          popoverAvatar.innerHTML = `<span>${initial}</span>`;
        }
      }

      function getAiAvatarSmallHTML(spinning = false) {
        const cls = spinning ? 'ai-avatar spinning' : 'ai-avatar';
        return `<div class="${cls}"><svg width="18" height="18" viewBox="0 0 100 100" style="color: ${spinning ? 'var(--cyan-neon)' : '#fff'};"><use href="#natsune-logo-shape"></use></svg></div>`;
      }

      function renderHistory() {
        historyList.innerHTML = '';
        if (brain.chats.length === 0) {
          historyList.innerHTML = `<div style="color:var(--text-secondary); font-size:13px; padding:10px 6px;">No hay chats guardados.</div>`;
          return;
        }

        brain.chats.forEach(chat => {
          const item = document.createElement('div');
          item.className = 'history-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'chat-checkbox';
          checkbox.dataset.chatId = chat.id;
          checkbox.addEventListener('click', (e) => {
            e.stopPropagation();
            updateBulkDeleteCounter();
          });

          const titleSpan = document.createElement('span');
          titleSpan.className = 'history-item-title';
          titleSpan.textContent = chat.title;

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'delete-chat-btn';
          delBtn.title = 'Eliminar este chat';
          delBtn.innerHTML = `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          `;
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            brain.deleteChat(chat.id);
            if (brain.activeChatId === chat.id) resetToNewChat();
            renderHistory();
          });

          item.addEventListener('click', () => {
            if (selectMode) {
              checkbox.checked = !checkbox.checked;
              updateBulkDeleteCounter();
            } else {
              openChat(chat.id);
            }
          });

          item.appendChild(checkbox);
          item.appendChild(titleSpan);
          item.appendChild(delBtn);
          historyList.appendChild(item);
        });
        updateBulkDeleteCounter();
      }

      function updateBulkDeleteCounter() {
        const checked = historyList.querySelectorAll('.chat-checkbox:checked');
        selectedCountSpan.textContent = checked.length;
        if (selectMode && checked.length > 0) {
          deleteSelectedBtn.classList.add('visible');
        } else {
          deleteSelectedBtn.classList.remove('visible');
        }
      }

      toggleSelectModeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectMode = !selectMode;
        historyList.classList.toggle('select-mode', selectMode);
        toggleSelectModeBtn.textContent = selectMode ? 'Cancelar' : 'Seleccionar';
        if (!selectMode) {
          historyList.querySelectorAll('.chat-checkbox').forEach(cb => cb.checked = false);
        }
        updateBulkDeleteCounter();
      });

      deleteSelectedBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const checkedIds = Array.from(historyList.querySelectorAll('.chat-checkbox:checked')).map(cb => cb.dataset.chatId);
        if (checkedIds.length === 0) return;
        brain.deleteMultipleChats(checkedIds);
        if (!brain.activeChatId) resetToNewChat();
        selectMode = false;
        historyList.classList.remove('select-mode');
        toggleSelectModeBtn.textContent = 'Seleccionar';
        renderHistory();
      });

      function openChat(id) {
        const chat = brain.chats.find(c => c.id === id);
        if (!chat) return;
        brain.activeChatId = id;
        closeSidebarDrawer();
        welcomeScreen.style.display = 'none';
        messagesContainer.style.display = 'flex';
        messagesContainer.innerHTML = '';

        if (chat.messages.length === 0) {
          appendUserBubble(chat.title, null);
          appendAiBubble(`Hola ${brain.userName}, hemos retomado "${chat.title}". ¿Qué deseas hacer ahora?`, null);
        } else {
          chat.messages.forEach(msg => {
            if (msg.role === 'user') {
              appendUserBubble(msg.text, msg.attachment);
            } else {
              appendAiBubble(msg.text, msg.codePreview);
            }
          });
        }
      }

      function resetToNewChat() {
        brain.activeChatId = null;
        messagesContainer.innerHTML = '';
        messagesContainer.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        promptInput.value = '';
        clearAttachment();

        // Saludo espontáneo estilo Undertale (50% de probabilidad)
        const spontaneous = brain.checkForSpontaneousGreeting();
        if (spontaneous) {
          welcomeScreen.style.display = 'none';
          messagesContainer.style.display = 'flex';
          appendAiBubble(spontaneous, null);
        }
      }

      function openSidebarDrawer() {
        closeAllPopovers();
        sidebar.classList.add('open');
        overlay.classList.add('open');
      }

      function closeSidebarDrawer() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
      }

      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSidebarDrawer();
      });

      closeSidebar.addEventListener('click', closeSidebarDrawer);
      overlay.addEventListener('click', closeSidebarDrawer);
      newChatBtn.addEventListener('click', () => {
        resetToNewChat();
        closeSidebarDrawer();
      });

      function closeAllPopovers() {
        modelDropdown.classList.remove('open');
        profileDropdown.classList.remove('open');
        attachPopover.classList.remove('open');
      }

      document.addEventListener('click', closeAllPopovers);

      modelSelectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = modelDropdown.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) modelDropdown.classList.add('open');
      });

      modelDropdown.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          currentModelName.textContent = item.dataset.model;
          closeAllPopovers();
        });
      });

      profileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = profileDropdown.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) profileDropdown.classList.add('open');
      });

      profileDropdown.addEventListener('click', (e) => e.stopPropagation());
      changeUserPhotoBtn.addEventListener('click', () => userAvatarSelector.click());

      userAvatarSelector.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          brain.setUserAvatar(evt.target.result);
          renderUserIdentity();
        };
        reader.readAsDataURL(file);
      });

      saveProfileBtn.addEventListener('click', () => {
        const val = userNameInput.value.trim();
        const keyVal = apiKeyInput.value.trim();
        if (val) {
          brain.setUserName(val);
        }
        if (keyVal) {
          brain.setApiKey(keyVal);
        }
        renderUserIdentity();
        closeAllPopovers();
      });

      attachBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = attachPopover.classList.contains('open');
        closeAllPopovers();
        if (!wasOpen) attachPopover.classList.add('open');
      });

      attachPopover.addEventListener('click', (e) => e.stopPropagation());

      optUploadImage.addEventListener('click', () => {
        closeAllPopovers();
        fileInputSelector.accept = 'image/*';
        fileInputSelector.click();
      });

      optUploadFile.addEventListener('click', () => {
        closeAllPopovers();
        fileInputSelector.accept = '.txt,.md,.json,.csv,.js,.html,.css,.py,.xml,.log,*/*';
        fileInputSelector.click();
      });

      fileInputSelector.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const isImage = file.type.startsWith('image/');
        previewName.textContent = `${file.name} (${Math.max(1, Math.round(file.size / 1024))} KB)`;

        if (isImage) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const dataUrl = evt.target.result;
            const imgObj = new Image();
            imgObj.onload = () => {
              currentAttachment = {
                name: file.name,
                type: file.type,
                isImage: true,
                dataUrl: dataUrl,
                dimensions: `${imgObj.width}x${imgObj.height}px`
              };
              previewThumb.src = dataUrl;
              previewThumb.style.display = 'block';
              attachmentPreview.style.display = 'flex';
              updateInputButtonState();
            };
            imgObj.src = dataUrl;
          };
          reader.readAsDataURL(file);
        } else {
          const reader = new FileReader();
          reader.onload = (evt) => {
            currentAttachment = {
              name: file.name,
              type: file.type || 'Archivo de texto/datos',
              isImage: false,
              textContent: evt.target.result || ''
            };
            previewThumb.style.display = 'none';
            attachmentPreview.style.display = 'flex';
            updateInputButtonState();
          };
          reader.readAsText(file);
        }
      });

      function clearAttachment() {
        currentAttachment = null;
        attachmentPreview.style.display = 'none';
        fileInputSelector.value = '';
        updateInputButtonState();
      }

      removeAttachBtn.addEventListener('click', clearAttachment);

      promptBox.addEventListener('click', (e) => {
        if (e.target === promptBox) promptInput.focus();
      });

      function updateInputButtonState() {
        const ready = promptInput.value.trim().length > 0 || currentAttachment !== null;
        if (ready) {
          waveIcon.style.display = 'none';
          sendIcon.style.display = 'block';
          sendOrWaveBtn.classList.add('send-ready');
        } else {
          waveIcon.style.display = 'block';
          sendIcon.style.display = 'none';
          sendOrWaveBtn.classList.remove('send-ready');
        }
      }

      promptInput.addEventListener('input', updateInputButtonState);

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendMessage();
        }
      });

      sendOrWaveBtn.addEventListener('click', () => {
        if (promptInput.value.trim().length > 0 || currentAttachment !== null) {
          sendMessage();
        } else {
          promptInput.placeholder = 'Escuchando tu voz...';
          promptInput.focus();
          setTimeout(() => { promptInput.placeholder = 'Pedir a Natsune IA'; }, 2000);
        }
      });

      micBtn.addEventListener('click', () => {
        promptInput.placeholder = 'Habla ahora...';
        promptInput.focus();
        setTimeout(() => { promptInput.placeholder = 'Pedir a Natsune IA'; }, 2000);
      });

      async function sendMessage() {
        const text = promptInput.value.trim();
        const att = currentAttachment;
        if (!text && !att) return;

        if (welcomeScreen.style.display !== 'none') {
          welcomeScreen.style.display = 'none';
          messagesContainer.style.display = 'flex';
        }

        brain.addMessageToActive('user', text, att);
        renderHistory();

        appendUserBubble(text, att);
        promptInput.value = '';
        clearAttachment();

        const loaderId = appendLoading();
        
        const result = await brain.processResponse(text, att, currentModelName.textContent);
        
        const loader = document.getElementById(loaderId);
        if (loader) loader.remove();

        brain.addMessageToActive('ai', result.reply, null, result.snippet);
        appendAiBubble(result.reply, result.snippet);
      }

      function appendUserBubble(text, att) {
        const row = document.createElement('div');
        row.className = 'message-row user';
        let html = `<div class="user-bubble">`;
        if (att) {
          if (att.isImage && att.dataUrl) {
            html += `<img src="${att.dataUrl}" alt="${escapeHTML(att.name)}" />`;
          } else {
            html += `<div class="file-chip">📄 ${escapeHTML(att.name)}</div>`;
          }
        }
        if (text) {
          html += `<div>${escapeHTML(text)}</div>`;
        }
        html += `</div>`;
        row.innerHTML = html;
        messagesContainer.appendChild(row);
        chatViewport.scrollTop = chatViewport.scrollHeight;
      }

      function appendLoading() {
        const id = 'loader-' + Date.now();
        const row = document.createElement('div');
        row.className = 'message-row';
        row.id = id;
        row.innerHTML = `
          ${getAiAvatarSmallHTML(true)}
          <div class="ai-bubble" style="color: var(--text-secondary);">Pensando con cariño...</div>
        `;
        messagesContainer.appendChild(row);
        chatViewport.scrollTop = chatViewport.scrollHeight;
        return id;
      }

      function appendAiBubble(text, snippet) {
        const row = document.createElement('div');
        row.className = 'message-row';
        const formatted = escapeHTML(text)
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/\n/g, '<br>');

        let snippetHTML = '';
        if (snippet) {
          snippetHTML = `<div class="code-snippet-box">${escapeHTML(snippet)}</div>`;
        }

        row.innerHTML = `
          ${getAiAvatarSmallHTML(false)}
          <div class="ai-bubble">${formatted}${snippetHTML}</div>
        `;
        messagesContainer.appendChild(row);
        chatViewport.scrollTop = chatViewport.scrollHeight;
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag]));
      }

      // Initial render & check spontaneous greeting on load
      renderUserIdentity();
      renderHistory();

      const initialGreeting = brain.checkForSpontaneousGreeting();
      if (initialGreeting) {
        welcomeScreen.style.display = 'none';
        messagesContainer.style.display = 'flex';
        appendAiBubble(initialGreeting, null);
      }
    });
  </script>
</body>
</html>
