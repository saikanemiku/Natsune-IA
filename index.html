<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Natsune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #131314;
            color: #e3e3e3;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .gemini-gradient-text {
            background: linear-gradient(90deg, #4285f4, #38bdf8, #a8c7fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Ocultar barra de scroll pero permitir deslizar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col justify-between overflow-hidden select-none">

    <!-- Barra Superior Minimalista estilo Gemini -->
    <header class="flex items-center justify-between px-4 pt-3 pb-2 bg-[#131314]/95 backdrop-blur-md z-20">
        <!-- Menú / Nuevo Chat -->
        <button onclick="resetChat()" title="Nuevo chat" class="p-2.5 rounded-full hover:bg-[#1e1f20] text-[#c4c7c5] transition active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
        </button>

        <!-- Selector de Modelo central tipo píldora -->
        <div class="relative flex items-center bg-[#1e1f20] hover:bg-[#282a2c] rounded-full px-3.5 py-1.5 transition">
            <span class="text-sky-400 mr-1.5 text-xs">✦</span>
            <select id="modelSelector" class="bg-transparent text-sm font-medium text-[#e3e3e3] appearance-none pr-4 focus:outline-none cursor-pointer">
                <option value="natsune" class="bg-[#1e1f20]">Natsune 2.0</option>
                <option value="gemini" class="bg-[#1e1f20]">Gemini Pro</option>
                <option value="chatgpt" class="bg-[#1e1f20]">ChatGPT-4o</option>
                <option value="claude" class="bg-[#1e1f20]">Claude 3.5</option>
                <option value="grok" class="bg-[#1e1f20]">Grok 2</option>
            </select>
            <svg class="w-3.5 h-3.5 text-[#c4c7c5] pointer-events-none -ml-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </div>

        <!-- Botón de Ajustes / Memoria -->
        <button onclick="toggleSettings()" class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-xs font-semibold text-white shadow-md active:scale-95 transition">
            N
        </button>
    </header>

    <!-- Área Central de Conversación -->
    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 sm:px-6 max-w-3xl w-full mx-auto flex flex-col no-scrollbar">
        
        <!-- Pantalla de Bienvenida estilo Gemini (se oculta al escribir) -->
        <div id="welcomeScreen" class="my-auto py-6 space-y-6">
            <div class="space-y-1 px-1">
                <h1 id="dynamicGreeting" class="text-3xl sm:text-4xl font-semibold tracking-tight gemini-gradient-text leading-tight">
                    Hola
                </h1>
                <p id="dynamicSubtitle" class="text-xl sm:text-2xl font-medium text-[#444746]">
                    ¿En qué te puedo ayudar hoy?
                </p>
            </div>

            <!-- Tarjetas de sugerencias deslizables estilo Gemini -->
            <div class="flex space-x-3 overflow-x-auto no-scrollbar pb-2 pt-2">
                <button onclick="quickPrompt('Ayúdame a organizar mis ideas para un proyecto')" class="flex-shrink-0 w-44 bg-[#1e1f20] hover:bg-[#282a2c] p-4 rounded-2xl text-left flex flex-col justify-between h-32 transition active:scale-95">
                    <span class="text-xs text-[#e3e3e3] leading-snug">Organizar ideas para un proyecto</span>
                    <span class="w-7 h-7 rounded-full bg-[#131314] flex items-center justify-center text-sky-400 text-xs self-end">💡</span>
                </button>
                <button onclick="quickPrompt('Explícame un tema complejo de forma sencilla')" class="flex-shrink-0 w-44 bg-[#1e1f20] hover:bg-[#282a2c] p-4 rounded-2xl text-left flex flex-col justify-between h-32 transition active:scale-95">
                    <span class="text-xs text-[#e3e3e3] leading-snug">Explicar un tema de forma sencilla</span>
                    <span class="w-7 h-7 rounded-full bg-[#131314] flex items-center justify-center text-sky-400 text-xs self-end">✨</span>
                </button>
                <button onclick="quickPrompt('¿Qué recuerdas de nuestras charlas anteriores?')" class="flex-shrink-0 w-44 bg-[#1e1f20] hover:bg-[#282a2c] p-4 rounded-2xl text-left flex flex-col justify-between h-32 transition active:scale-95">
                    <span class="text-xs text-[#e3e3e3] leading-snug">Revisar nuestra memoria guardada</span>
                    <span class="w-7 h-7 rounded-full bg-[#131314] flex items-center justify-center text-sky-400 text-xs self-end">🧠</span>
                </button>
            </div>
        </div>

        <!-- Contenedor de mensajes activos -->
        <div id="messagesList" class="space-y-6 py-4 hidden"></div>
    </main>

    <!-- Barra Inferior de Interacción Cápsula estilo Gemini -->
    <footer class="px-3 pb-3 pt-1 max-w-3xl w-full mx-auto bg-[#131314]">
        <div class="bg-[#1e1f20] rounded-[28px] px-3 py-2 flex items-end space-x-2 shadow-lg border border-transparent focus-within:border-[#3c4043] transition">
            
            <!-- Botón + (Opciones / Limpiar memoria) -->
            <button onclick="toggleSettings()" title="Configuración y APIs" class="p-2 rounded-full text-[#c4c7c5] hover:bg-[#282a2c] transition flex-shrink-0 mb-0.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            </button>

            <!-- Campo de texto autoajustable -->
            <textarea id="userInput" rows="1" placeholder="Pregúntale a Natsune" class="w-full bg-transparent border-none focus:outline-none text-[15px] text-[#e3e3e3] placeholder-[#8e918f] py-2 resize-none max-h-32 leading-snug select-text"></textarea>

            <!-- Botón de Enviar -->
            <button id="sendBtn" onclick="sendMessage()" class="p-2.5 rounded-full text-[#131314] bg-[#a8c7fa] hover:bg-sky-300 transition flex-shrink-0 mb-0.5 active:scale-90">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
        <p class="text-center text-[10px] text-[#8e918f] mt-1.5">Natsune puede cometer errores. Memoria local activa.</p>
    </footer>

    <!-- Modal de Configuración y Personalización -->
    <div id="settingsModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#1e1f20] border border-[#3c4043] rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-semibold text-[#e3e3e3]">Ajustes y Memoria de Natsune</h2>
                <button onclick="toggleSettings()" class="text-[#8e918f] hover:text-white text-lg">✕</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-[#c4c7c5]">¿Cómo quieres que te llame Natsune?</label>
                    <input type="text" id="userNameInput" placeholder="Tu nombre o apodo..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3.5 py-2 text-sm text-white mt-1 focus:border-sky-400 focus:outline-none">
                </div>
                <hr class="border-[#3c4043]">
                <p class="text-[11px] text-[#8e918f]">Llaves API opcionales (se guardan solo en tu iPhone):</p>
                <div>
                    <label class="text-xs text-[#c4c7c5]">Google Gemini API Key:</label>
                    <input type="password" id="keyGemini" placeholder="AIzaSy..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3.5 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-[#c4c7c5]">OpenAI (ChatGPT) Key:</label>
                    <input type="password" id="keyOpenAI" placeholder="sk-..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3.5 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-[#c4c7c5]">Anthropic (Claude) Key:</label>
                    <input type="password" id="keyClaude" placeholder="sk-ant-..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3.5 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="clearMemory()" class="text-xs text-red-400 hover:underline">Borrar historial</button>
                <div class="space-x-2">
                    <button onclick="toggleSettings()" class="px-4 py-2 rounded-full text-xs text-[#c4c7c5] hover:bg-[#282a2c]">Cerrar</button>
                    <button onclick="saveSettings()" class="px-5 py-2 rounded-full text-xs bg-[#a8c7fa] text-[#131314] font-semibold">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');

        // Auto-ajustar altura del textarea como en Gemini
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });

        function initApp() {
            const savedName = localStorage.getItem('natsune_username') || '';
            document.getElementById('userNameInput').value = savedName;
            document.getElementById('keyGemini').value = localStorage.getItem('key_gemini') || '';
            document.getElementById('keyOpenAI').value = localStorage.getItem('key_openai') || '';
            document.getElementById('keyClaude').value = localStorage.getItem('key_claude') || '';

            updateDynamicGreeting(savedName);

            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
            if (history.length > 0) {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('messagesList').classList.remove('hidden');
                history.forEach(msg => renderMessage(msg.role, msg.content, false));
            }
        }

        function updateDynamicGreeting(name) {
            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
            const greetingEl = document.getElementById('dynamicGreeting');
            const subtitleEl = document.getElementById('dynamicSubtitle');
            const displayName = name ? `, ${name}` : '';

            greetingEl.textContent = `Hola${displayName}`;

            if (history.length === 0) {
                subtitleEl.textContent = "¿Por dónde empezamos hoy?";
            } else if (history.length < 6) {
                subtitleEl.textContent = "¿En qué seguimos trabajando?";
            } else {
                const lastUserMsg = [...history].reverse().find(m => m.role === 'user');
                subtitleEl.textContent = lastUserMsg 
                    ? `¿Retomamos lo último o vemos algo nuevo?` 
                    : "¿Qué tienes en mente hoy?";
            }
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            const name = document.getElementById('userNameInput').value.trim();
            localStorage.setItem('natsune_username', name);
            localStorage.setItem('key_gemini', document.getElementById('keyGemini').value.trim());
            localStorage.setItem('key_openai', document.getElementById('keyOpenAI').value.trim());
            localStorage.setItem('key_claude', document.getElementById('keyClaude').value.trim());
            
            updateDynamicGreeting(name);
            toggleSettings();
        }

        function clearMemory() {
            localStorage.removeItem('natsune_history');
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('messagesList').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            updateDynamicGreeting(localStorage.getItem('natsune_username') || '');
            toggleSettings();
        }

        function resetChat() {
            // Inicia una vista limpia manteniendo la memoria de contexto
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('messagesList').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            updateDynamicGreeting(localStorage.getItem('natsune_username') || '');
        }

        function quickPrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        function renderMessage(sender, text, save = true) {
            document.getElementById('welcomeScreen').classList.add('hidden');
            const messagesList = document.getElementById('messagesList');
            messagesList.classList.remove('hidden');

            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start items-start space-x-3'}`;

            if (isUser) {
                // Burbuja estilo Gemini para el usuario (gris oscuro redondeado)
                wrapper.innerHTML = `
                    <div class="bg-[#282a2c] text-[#e3e3e3] px-4 py-3 rounded-3xl rounded-br-md max-w-[82%] text-[15px] leading-relaxed select-text">
                        <p class="whitespace-pre-wrap">${text}</p>
                    </div>
                `;
            } else {
                // Respuesta limpia sin caja y con estrella celeste estilo Gemini
                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-sky-400 flex-shrink-0 flex items-center justify-center text-xs text-white mt-0.5 shadow-sm">
                        ✦
                    </div>
                    <div class="text-[#e3e3e3] text-[15px] leading-relaxed max-w-[88%] select-text pt-0.5">
                        <p class="whitespace-pre-wrap">${text}</p>
                    </div>
                `;
            }

            messagesList.appendChild(wrapper);
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save) {
                const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
                history.push({ role: sender, content: text });
                localStorage.setItem('natsune_history', JSON.stringify(history));
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessage('user', text);

            const model = document.getElementById('modelSelector').value;
            const userName = localStorage.getItem('natsune_username') || '';
            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');

            // Respuesta natural y contextual de Natsune Core (sin API externa requerida)
            if (model === 'natsune') {
                setTimeout(() => {
                    const lower = text.toLowerCase();
                    let reply = "";

                    if (lower.includes('hola') || lower.includes('buenas')) {
                        reply = `¡Hola${userName ? ' ' + userName : ''}! Todo listo por aquí. ¿Qué tienes en mente hoy?`;
                    } else if (lower.includes('recuerdas') || lower.includes('memoria')) {
                        reply = history.length > 2 
                            ? `Claro, tengo guardados nuestros últimos ${history.length} mensajes en la memoria de tu dispositivo. Si quieres que recuerde tu nombre o preferencias fijas, puedes ajustarlo tocando el ícono azul "N" arriba a la derecha.`
                            : `Aún estamos empezando nuestra conversación, pero todo lo que hablemos aquí quedará guardado en tu iPhone para futuras sesiones.`;
                    } else {
                        reply = `Te entiendo perfectamente${userName ? ', ' + userName : ''}. Sobre "${text}", estoy trabajando en modo local ahora mismo.\n\nSi quieres respuestas conectadas a internet en tiempo real con Gemini, ChatGPT o Claude, toca el ícono "N" arriba a la derecha y pega tu llave API gratuita de Google AI Studio.`;
                    }
                    renderMessage('natsune', reply);
                }, 450);
                return;
            }

            // Conexión real con Gemini API si el usuario puso su llave
            if (model === 'gemini') {
                const apiKey = localStorage.getItem('key_gemini');
                if (!apiKey) {
                    renderMessage('natsune', 'Para usar Gemini Pro en vivo, toca el círculo azul "N" arriba a la derecha y pega tu API Key de Google AI Studio.');
                    return;
                }
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Eres Natsune, una IA cercana, inteligente y útil. El usuario se llama ${userName || 'amigo'}. Responde a: ${text}` }] }]
                        })
                    });
                    const data = await res.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No pude obtener respuesta de Gemini. Revisa tu llave API.";
                    renderMessage('natsune', aiText);
                } catch (e) {
                    renderMessage('natsune', 'Hubo un problema de conexión al contactar con Gemini.');
                }
                return;
            }

            renderMessage('natsune', `Para activar ${model.toUpperCase()}, ingresa su llave API en el menú de ajustes (botón "N" arriba a la derecha).`);
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
