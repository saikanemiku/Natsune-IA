<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Natsune</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><g transform='translate(50,50)'><path d='M-28,6 C-38,16 -32,34 -8,32 C-24,30 -28,18 -20,12 Z' fill='%23ffffff'/><path d='M-22,12 C-30,20 -24,30 -4,28 C-16,26 -20,18 -14,14 Z' fill='%23ffffff'/><path d='M28,-6 C38,-16 32,-34 8,-32 C24,-30 28,-18 20,-12 Z' fill='%23ffffff'/><path d='M22,-12 C30,-20 24,-30 4,-28 C16,-26 20,-18 14,-14 Z' fill='%23ffffff'/><polygon points='-11,-24 11,-24 24,-11 24,11 11,24 -11,24 -24,11 -24,-11' fill='%23ffffff'/><circle cx='0' cy='0' r='13' fill='%23000000'/><circle cx='0' cy='0' r='9.5' fill='%23ffffff'/><circle cx='0' cy='0' r='6.5' fill='%23000000'/></g></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #e3e3e3;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .natsune-rainbow-text {
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gemini-ambient-glow {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 150px;
            background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.28) 0%, rgba(14, 165, 233, 0.08) 50%, rgba(0, 0, 0, 0) 80%);
            pointer-events: none;
            z-index: 10;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col justify-between overflow-hidden select-none relative bg-black">

    <div class="gemini-ambient-glow"></div>

    <!-- Menú Lateral Desplegable (Hamburguesa) -->
    <div id="sideDrawer" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity">
        <div class="absolute left-0 top-0 bottom-0 w-72 bg-[#121316] border-r border-[#262930] p-4 flex flex-col justify-between shadow-2xl">
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <span class="text-white font-medium text-base">Historial de Natsune</span>
                    <button onclick="toggleDrawer()" class="text-[#8e918f] hover:text-white p-2 text-lg">✕</button>
                </div>
                <button onclick="resetChat(); toggleDrawer();" class="w-full bg-[#1e1f20] hover:bg-[#282a2c] text-sky-400 border border-[#3c4043] rounded-full py-2.5 px-4 text-sm font-medium text-left flex items-center space-x-2 transition">
                    <span>+</span>
                    <span>Nuevo chat</span>
                </button>
                <div class="space-y-2 pt-2">
                    <p class="text-[11px] text-[#8e918f] uppercase tracking-wider">Conversaciones recientes</p>
                    <div id="historyList" class="space-y-1 text-sm text-[#c4c7c5]">
                        <p class="text-xs text-[#666] italic py-2">No hay chats anteriores</p>
                    </div>
                </div>
            </div>
            <div class="text-xs text-[#8e918f] border-t border-[#262930] pt-3">
                Natsune Core • Memoria Privada
            </div>
        </div>
    </div>

    <!-- Cabecera -->
    <header class="flex items-center justify-between px-4 py-3 bg-black z-20">
        <div class="flex items-center space-x-3">
            <button onclick="toggleDrawer()" title="Menú" class="p-2 rounded-full hover:bg-[#1f2124] text-[#c4c7c5] transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="flex items-center space-x-2">
                <span class="text-lg font-medium tracking-tight text-white">Natsune</span>
                <span class="text-[11px] bg-[#1e1f20] text-[#38bdf8] px-2 py-0.5 rounded-full border border-[#3c4043] font-normal">Advanced</span>
            </div>
        </div>

        <div class="flex items-center space-x-2.5">
            <div class="relative flex items-center bg-[#1e1f20] hover:bg-[#282a2c] border border-[#3c4043] rounded-full px-3 py-1">
                <select id="modelSelector" class="bg-transparent text-xs font-medium text-[#e3e3e3] appearance-none pr-4 focus:outline-none cursor-pointer">
                    <option value="natsune" class="bg-[#1e1f20]">Natsune Inteligente</option>
                    <option value="gemini" class="bg-[#1e1f20]">Gemini Pro</option>
                    <option value="chatgpt" class="bg-[#1e1f20]">ChatGPT-4o</option>
                    <option value="claude" class="bg-[#1e1f20]">Claude 3.5</option>
                </select>
                <svg class="w-3.5 h-3.5 text-sky-400 pointer-events-none -ml-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>

            <!-- Botón de Perfil con ID exacto -->
            <button onclick="toggleSettings()" id="profileAvatarBtn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-sky-400 flex items-center justify-center text-xs font-bold text-white shadow-sm transition active:scale-95">
                N
            </button>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 max-w-2xl w-full mx-auto flex flex-col no-scrollbar z-10 pt-2 pb-6">
        
        <!-- Pantalla de Bienvenida -->
        <div id="welcomeScreen" class="my-auto space-y-6 text-left py-8">
            <div class="space-y-1.5">
                <h1 id="welcomeTitle" class="text-4xl sm:text-5xl font-medium tracking-tight natsune-rainbow-text">
                    Hola
                </h1>
                <p class="text-3xl sm:text-4xl font-medium text-[#444746] tracking-tight">
                    ¿En qué te puedo ayudar hoy?
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4">
                <button onclick="quickPrompt('Ayúdame a organizar mis ideas o un proyecto')" class="p-4 bg-[#1e1f20]/90 hover:bg-[#282a2c] border border-[#3c4043]/50 rounded-2xl text-left transition flex flex-col justify-between h-28 active:scale-95">
                    <span class="text-sm text-[#e3e3e3] font-normal leading-snug">Organizar una idea o proyecto</span>
                    <span class="text-sky-400 text-sm self-end">✦</span>
                </button>
                <button onclick="quickPrompt('Charlar un rato y debatir sobre algún tema curioso')" class="p-4 bg-[#1e1f20]/90 hover:bg-[#282a2c] border border-[#3c4043]/50 rounded-2xl text-left transition flex flex-col justify-between h-28 active:scale-95">
                    <span class="text-sm text-[#e3e3e3] font-normal leading-snug">Charlar y debatir algo curioso</span>
                    <span class="text-sky-400 text-sm self-end">✦</span>
                </button>
            </div>
        </div>

        <div id="messagesList" class="space-y-6 hidden"></div>
    </main>

    <!-- Barra Inferior -->
    <footer class="px-4 pb-4 pt-2 max-w-2xl w-full mx-auto relative z-20">
        <div class="bg-[#1e1f20] backdrop-blur-xl rounded-[28px] px-4 py-2.5 flex items-center space-x-3 border border-[#3c4043] shadow-[0_0_25px_rgba(56,189,248,0.15)] focus-within:border-sky-400 focus-within:shadow-[0_0_35px_rgba(56,189,248,0.3)] transition">
            
            <button onclick="toggleSettings()" class="text-[#c4c7c5] hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            </button>

            <textarea id="userInput" rows="1" placeholder="Pregúntale a Natsune..." class="w-full bg-transparent border-none focus:outline-none text-base text-[#e3e3e3] placeholder-[#8e918f] resize-none max-h-32 leading-relaxed select-text"></textarea>

            <button id="sendBtn" onclick="sendMessage()" class="p-2 rounded-full bg-[#d3e3fd] hover:bg-white text-[#131314] transition active:scale-90">
                <svg class="w-4 h-4 rotate-90" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </footer>

    <!-- Modal de Ajustes Completo -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#1e1f20] border border-[#3c4043] rounded-3xl p-6 max-w-sm w-full space-y-3.5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-medium text-white">Configuración de Natsune</h3>
                <button onclick="toggleSettings()" class="text-[#8e918f] hover:text-white text-lg">✕</button>
            </div>
            <div>
                <label class="text-xs text-[#c4c7c5]">Tu Nombre:</label>
                <input type="text" id="userNameInput" placeholder="¿Cómo te llamas?" class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3 py-2 text-sm text-white mt-1 focus:border-sky-400 focus:outline-none">
            </div>
            <div>
                <label class="text-xs text-[#c4c7c5]">Inicial o Emoji del perfil (ej: N o 🚀):</label>
                <input type="text" id="userAvatarInput" maxlength="3" placeholder="N" class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3 py-2 text-sm text-white mt-1 focus:border-sky-400 focus:outline-none text-center font-bold text-sky-400">
            </div>
            <hr class="border-[#3c4043]">
            <p class="text-[11px] text-[#8e918f]">Llaves API (para modelos externos en vivo):</p>
            <div>
                <label class="text-xs text-[#c4c7c5]">Gemini API Key:</label>
                <input type="password" id="keyGemini" placeholder="AIzaSy..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
            </div>
            <div>
                <label class="text-xs text-[#c4c7c5]">ChatGPT (OpenAI) Key:</label>
                <input type="password" id="keyOpenAI" placeholder="sk-..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
            </div>
            <div>
                <label class="text-xs text-[#c4c7c5]">Claude (Anthropic) Key:</label>
                <input type="password" id="keyClaude" placeholder="sk-ant-..." class="w-full bg-[#131314] border border-[#3c4043] rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-sky-400 focus:outline-none">
            </div>
            <div class="flex justify-between pt-3">
                <button onclick="clearMemory()" class="text-xs text-red-400">Borrar chat</button>
                <button onclick="saveSettings()" class="bg-[#d3e3fd] text-[#131314] px-4 py-2 rounded-full text-xs font-semibold">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem('natsune_username') || '';
            const savedAvatar = localStorage.getItem('natsune_avatar') || 'N';
            
            document.getElementById('userNameInput').value = savedName;
            document.getElementById('userAvatarInput').value = savedAvatar;
            document.getElementById('profileAvatarBtn').textContent = savedAvatar;

            document.getElementById('keyGemini').value = localStorage.getItem('key_gemini') || '';
            document.getElementById('keyOpenAI').value = localStorage.getItem('key_openai') || '';
            document.getElementById('keyClaude').value = localStorage.getItem('key_claude') || '';
            updateGreeting(savedName);

            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
            if (history.length > 0) {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('messagesList').classList.remove('hidden');
                history.forEach(msg => renderMessage(msg.role, msg.content, false));
                updateHistoryDrawer(history);
            }
        });

        function updateGreeting(name) {
            document.getElementById('welcomeTitle').textContent = name ? `Hola, ${name}` : 'Hola';
        }

        function toggleSettings() { 
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden'); 
        }

        function toggleDrawer() { 
            const drawer = document.getElementById('sideDrawer');
            drawer.classList.toggle('hidden'); 
        }

        function saveSettings() {
            const name = document.getElementById('userNameInput').value.trim();
            let avatar = document.getElementById('userAvatarInput').value.trim() || 'N';
            
            localStorage.setItem('natsune_username', name);
            localStorage.setItem('natsune_avatar', avatar);
            document.getElementById('profileAvatarBtn').textContent = avatar;

            localStorage.setItem('key_gemini', document.getElementById('keyGemini').value.trim());
            localStorage.setItem('key_openai', document.getElementById('keyOpenAI').value.trim());
            localStorage.setItem('key_claude', document.getElementById('keyClaude').value.trim());
            
            updateGreeting(name);
            toggleSettings();
        }

        function clearMemory() {
            localStorage.removeItem('natsune_history');
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('messagesList').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('historyList').innerHTML = '<p class="text-xs text-[#666] italic py-2">No hay chats anteriores</p>';
            toggleSettings();
        }

        function resetChat() {
            document.getElementById('messagesList').innerHTML = '';
            document.getElementById('messagesList').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
        }

        function quickPrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        function updateHistoryDrawer(history) {
            const list = document.getElementById('historyList');
            const userMsgs = history.filter(m => m.role === 'user');
            if (userMsgs.length === 0) {
                list.innerHTML = '<p class="text-xs text-[#666] italic py-2">No hay chats anteriores</p>';
                return;
            }
            list.innerHTML = '';
            userMsgs.slice(-6).reverse().forEach(m => {
                const item = document.createElement('div');
                item.className = "truncate py-1.5 px-2 hover:bg-[#1e1f20] rounded-lg cursor-pointer text-xs text-[#e3e3e3]";
                item.textContent = m.content;
                item.onclick = () => { toggleDrawer(); };
                list.appendChild(item);
            });
        }

        function renderMessage(sender, text, save = true) {
            document.getElementById('welcomeScreen').classList.add('hidden');
            const messagesList = document.getElementById('messagesList');
            messagesList.classList.remove('hidden');

            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start space-x-3 items-start'}`;

            if (isUser) {
                wrapper.innerHTML = `<div class="bg-[#2b2d31] text-[#e3e3e3] px-4 py-3 rounded-2xl rounded-br-xs max-w-[85%] text-[15px] leading-relaxed select-text">${text}</div>`;
            } else {
                wrapper.innerHTML = `
                    <div class="w-7 h-7 flex-shrink-0 mt-1">
                        <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(50,50)">
                                <path d="M-28,6 C-38,16 -32,34 -8,32 C-24,30 -28,18 -20,12 Z" fill="#ffffff"/>
                                <path d="M-22,12 C-30,20 -24,30 -4,28 C-16,26 -20,18 -14,14 Z" fill="#ffffff"/>
                                <path d="M28,-6 C38,-16 32,-34 8,-32 C24,-30 28,-18 20,-12 Z" fill="#ffffff"/>
                                <path d="M22,-12 C30,-20 24,-30 4,-28 C16,-26 20,-18 14,-14 Z" fill="#ffffff"/>
                                <polygon points="-11,-24 11,-24 24,-11 24,11 11,24 -11,24 -24,11 -24,-11" fill="#ffffff"/>
                                <circle cx="0" cy="0" r="13" fill="#000000"/>
                                <circle cx="0" cy="0" r="9.5" fill="#ffffff"/>
                                <circle cx="0" cy="0" r="6.5" fill="#000000"/>
                            </g>
                        </svg>
                    </div>
                    <div class="text-[#e3e3e3] text-[15px] leading-relaxed max-w-[88%] select-text pt-1 font-normal">${text}</div>
                `;
            }

            messagesList.appendChild(wrapper);
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save) {
                const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
                history.push({ role: sender, content: text });
                localStorage.setItem('natsune_history', JSON.stringify(history));
                updateHistoryDrawer(history);
            }
        }

        function getLocalIntelligence(query, userName) {
            const q = query.toLowerCase();
            const name = userName ? `, ${userName}` : '';

            if (q.includes('hola') || q.includes('buenas') || q.includes('saludos')) {
                return `¡Hola${name}! Qué gusto saludarte de nuevo. ¿Qué planes o ideas tienes para hoy?`;
            }
            if (q.includes('quién eres') || q.includes('que eres') || q.includes('quien eres')) {
                return `Soy Natsune, tu asistente de inteligencia artificial personal. Cuento con diseño minimalista, memoria local privada en tu iPhone y capacidad autónoma para ayudarte.`;
            }
            if (q.includes('cómo estás') || q.includes('como estas')) {
                return `¡Todo al 100% por aquí! Y tú${name}, ¿cómo va tu día?`;
            }
            if (q.includes('gracias') || q.includes('excelente')) {
                return `¡De nada${name}! Aquí estoy siempre que necesites algo.`;
            }
            if (q.includes('idea') || q.includes('proyecto') || q.includes('organizar')) {
                return `Me encanta la idea de organizarnos. Cuéntame de qué trata tu proyecto y lo estructuramos paso a paso.`;
            }
            
            return `Te entiendo perfectamente${name}. Analizando lo que comentas sobre "${query}": es un tema interesante. Podemos abordarlo por partes, ver alternativas o armar un resumen. ¿Cómo te gustaría continuar?`;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessage('user', text);

            const model = document.getElementById('modelSelector').value;
            const userName = localStorage.getItem('natsune_username') || '';

            if (model === 'natsune') {
                setTimeout(() => {
                    const reply = getLocalIntelligence(text, userName);
                    renderMessage('natsune', reply);
                }, 400);
                return;
            }

            if (model === 'gemini') {
                const apiKey = localStorage.getItem('key_gemini');
                if (!apiKey) {
                    renderMessage('natsune', 'Para usar Gemini Pro en vivo, ingresa tu API Key en los ajustes.');
                    return;
                }
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await res.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error al recibir respuesta.";
                    renderMessage('natsune', aiText);
                } catch (e) {
                    renderMessage('natsune', 'Error de conexión con la API de Gemini.');
                }
                return;
            }

            renderMessage('natsune', `Para utilizar ${model.toUpperCase()}, asegúrate de haber guardado su llave API en los ajustes.`);
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
