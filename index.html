<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natsune IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-sidebar: #1e1f20;
      --bg-card: #1e1f20;
      --bg-input: #1a1c23;
      --text-primary: #e3e3e3;
      --text-secondary: #9aa0a6;
      --accent-blue: #a8c7fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at bottom, rgba(30, 58, 138, 0.25) 0%, transparent 60%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      height: 64px;
      flex-shrink: 0;
      gap: 12px;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .pill-dropdown {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .pill-dropdown:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .action-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .action-pill:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Center Main Area */
    .main-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      gap: 24px;
    }

    .center-logo-glow {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      filter: drop-shadow(0 0 16px rgba(168, 199, 250, 0.4));
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(168, 199, 250, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(168, 199, 250, 0.6)); }
    }

    .center-greeting {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      max-width: 500px;
    }

    /* Bottom Floating Input Bar */
    .bottom-input-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto 24px;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .floating-prompt-box {
      background-color: #1c1f26;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 8px 12px 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .floating-prompt-box:focus-within {
      background-color: #232630;
      border-color: rgba(168, 199, 250, 0.3);
    }

    .tool-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .tool-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      padding: 4px 0;
    }

    .prompt-input::placeholder {
      color: var(--text-secondary);
    }

    .audio-btn {
      background: #2b3142;
      color: var(--accent-blue);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: #353c52;
    }

    /* Sidebar Drawer */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background-color: var(--bg-sidebar);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .sidebar-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 650;
      color: var(--text-primary);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 600px) {
      .center-greeting {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Reusable SVG Definition for Natsune IA Logo -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <g id="natsune-logo-shape">
        <!-- Outer Octagonal Nut -->
        <path fill="currentColor" fill-rule="evenodd" d="M35.5 22 L64.5 22 L82 40.5 L82 59.5 L64.5 78 L35.5 78 L18 59.5 L18 40.5 Z M50 32 A18 18 0 1 0 50 68 A18 18 0 1 0 50 32 Z" />
        <!-- Inner Ring -->
        <path fill="currentColor" fill-rule="evenodd" d="M50 35.5 A14.5 14.5 0 1 0 50 64.5 A14.5 14.5 0 1 0 50 35.5 Z M50 39 A11 11 0 1 0 50 61 A11 11 0 1 0 50 39 Z" />
        <!-- Top-Right Orbital Swirl Blades -->
        <path fill="currentColor" d="M43 22 C58 14, 77 16, 86 24 C73 19, 57 19, 46 22 Z" />
        <path fill="currentColor" d="M55 22 C70 18, 86 23, 91 34 C83 27, 70 23, 58 24 Z" />
        <path fill="currentColor" d="M66 25 C79 25, 90 33, 90 45 C86 36, 78 30, 68 29 Z" />
        <!-- Bottom-Left Orbital Swirl Blades -->
        <path fill="currentColor" d="M57 78 C42 86, 23 84, 14 76 C27 81, 43 81, 54 78 Z" />
        <path fill="currentColor" d="M45 78 C30 82, 14 77, 9 66 C17 73, 30 77, 42 76 Z" />
        <path fill="currentColor" d="M34 75 C21 75, 10 67, 10 55 C14 64, 22 70, 32 71 Z" />
      </g>
    </defs>
  </svg>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar Drawer -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Natsune IA</span>
      <button class="icon-btn" id="closeSidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div style="color: var(--text-secondary); font-size: 14px;">Historial y ajustes próximamente.</div>
  </aside>

  <!-- Top Header -->
  <header class="top-bar">
    <div class="top-left">
      <button class="icon-btn" id="menuBtn" title="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button class="pill-dropdown" id="modelSelectBtn">
        <span>Automático</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <div class="top-right">
      <button class="icon-btn" title="Logotipo Natsune">
        <svg width="22" height="22" viewBox="0 0 100 100">
          <use href="#natsune-logo-shape"></use>
        </svg>
      </button>

      <button class="action-pill" id="updateBtn">
        <span>Actualizar</span>
      </button>

      <div class="user-avatar" title="Perfil">
        <span>S</span>
      </div>
    </div>
  </header>

  <!-- Center Assistant Screen -->
  <main class="main-center">
    <div class="center-logo-glow">
      <svg width="52" height="52" viewBox="0 0 100 100">
        <use href="#natsune-logo-shape"></use>
      </svg>
    </div>

    <h1 class="center-greeting" id="greetingText">¿Cómo puedo ayudarte, Sally?</h1>
  </main>

  <!-- Bottom Input Bar -->
  <div class="bottom-input-container">
    <div class="floating-prompt-box">
      <button class="tool-icon-btn" title="Adjuntar elemento">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <input 
        type="text" 
        class="prompt-input" 
        id="promptInput" 
        placeholder="Pedir a Natsune IA"
      />

      <button class="tool-icon-btn" title="Micrófono">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button class="audio-btn" title="Entrada de voz avanzada">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="20" x2="18" y2="4"></line>
          <line x1="12" y1="16" x2="12" y2="8"></line>
          <line x1="6" y1="13" x2="6" y2="11"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const updateBtn = document.getElementById('updateBtn');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('open');
    });

    closeSidebar.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });

    updateBtn.addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
