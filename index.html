<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natsune AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        natsuneDark: '#090a0f',
                        natsuneCard: '#131622',
                        natsuneBlue: '#2563eb',
                        natsuneSky: '#38bdf8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-natsuneDark text-slate-100 h-screen flex flex-col justify-between font-sans overflow-hidden">

    <!-- Barra Superior -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800/80 bg-natsuneDark/90 backdrop-blur z-10">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-natsuneBlue to-natsuneSky flex items-center justify-center font-bold text-white shadow-lg shadow-natsuneSky/20">N</div>
            <div>
                <span class="text-lg font-semibold tracking-wide bg-gradient-to-r from-white to-natsuneSky bg-clip-text text-transparent">Natsune</span>
                <span class="block text-[10px] text-slate-400">Sistema Multi-IA Unificado</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <!-- Selector de IA -->
            <select id="modelSelector" class="bg-natsuneCard border border-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-natsuneSky transition">
                <option value="natsune">⚡ Natsune Core</option>
                <option value="chatgpt">🤖 ChatGPT (GPT-4o)</option>
                <option value="claude">🧠 Claude (3.5 Sonnet)</option>
                <option value="gemini">✨ Gemini (Google)</option>
                <option value="grok">🚀 Grok (xAI)</option>
            </select>

            <!-- Botón de Ajustes (API Keys) -->
            <button onclick="toggleSettings()" class="p-2 rounded-xl bg-natsuneCard border border-slate-700 hover:border-natsuneSky transition text-slate-300">
                ⚙️
            </button>
        </div>
    </header>

    <!-- Contenedor Principal de Chat -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-3xl w-full mx-auto space-y-6">
        <!-- Saludo Dinámico inicial -->
        <div class="flex items-start space-x-3 my-auto">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-natsuneBlue to-natsuneSky flex-shrink-0 flex items-center justify-center text-xs font-bold text-white shadow-md shadow-natsuneSky/20">N</div>
            <div class="bg-natsuneCard border border-slate-800 p-4 rounded-2xl text-sm text-slate-200 shadow-xl max-w-xl">
                <p id="dynamicGreeting">Cargando sistema y memoria...</p>
            </div>
        </div>
    </main>

    <!-- Barra Inferior de Entrada -->
    <footer class="p-4 max-w-3xl w-full mx-auto">
        <div class="bg-natsuneCard border border-slate-800 rounded-2xl p-2 sm:p-3 flex items-center shadow-2xl focus-within:border-natsuneSky transition">
            <input type="text" id="userInput" placeholder="Pregúntale a Natsune..." class="w-full bg-transparent border-none focus:outline-none text-sm px-2 text-slate-100 placeholder-slate-500">
            <button onclick="sendMessage()" class="bg-gradient-to-r from-natsuneBlue to-natsuneSky text-white p-2.5 rounded-xl hover:opacity-90 transition shadow-md shadow-natsuneSky/20 flex-shrink-0">
                <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
        <p class="text-center text-[10px] text-slate-500 mt-2">Natsune AI • Memoria local activa en tu dispositivo</p>
    </footer>

    <!-- Modal de Configuración (API Keys) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-natsuneCard border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white">Configurar Llaves de API</h2>
            <p class="text-xs text-slate-400">Guarda tus llaves de acceso. Se almacenan únicamente en la memoria privada de tu navegador.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-300 font-medium">OpenAI Key (ChatGPT):</label>
                    <input type="password" id="keyOpenAI" class="w-full bg-natsuneDark border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-natsuneSky focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-300 font-medium">Anthropic Key (Claude):</label>
                    <input type="password" id="keyClaude" class="w-full bg-natsuneDark border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-natsuneSky focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-300 font-medium">Google Key (Gemini):</label>
                    <input type="password" id="keyGemini" class="w-full bg-natsuneDark border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mt-1 focus:border-natsuneSky focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="toggleSettings()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Cancelar</button>
                <button onclick="saveKeys()" class="px-4 py-2 rounded-xl text-xs bg-gradient-to-r from-natsuneBlue to-natsuneSky text-white font-medium shadow-md">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica de Natsune -->
    <script>
        // Sistema de Memoria y Saludos Dinámicos
        document.addEventListener("DOMContentLoaded", () => {
            cargarHistorialYGenerarSaludo();
            
            // Cargar llaves guardadas en inputs
            document.getElementById('keyOpenAI').value = localStorage.getItem('key_openai') || '';
            document.getElementById('keyClaude').value = localStorage.getItem('key_claude') || '';
            document.getElementById('keyGemini').value = localStorage.getItem('key_gemini') || '';
        });

        function getNatsuneGreeting() {
            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
            if (history.length === 0) {
                return "¿En qué puedo ayudarle hoy, usuario? Escucho sus órdenes.";
            } else if (history.length < 4) {
                return "Sistema activo. Es un gusto verte de nuevo por aquí. ¿Qué plan tenemos para esta sesión?";
            } else {
                return "Saludos de nuevo. He estado revisando nuestros registros y memoria anterior. ¿Cómo procedemos hoy?";
            }
        }

        function cargarHistorialYGenerarSaludo() {
            const greetingEl = document.getElementById('dynamicGreeting');
            greetingEl.textContent = getNatsuneGreeting();

            // Cargar mensajes previos si existen
            const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
            const chatContainer = document.getElementById('chatContainer');
            
            history.forEach(msg => {
                appendMessageUI(msg.role === 'user' ? 'user' : 'natsune', msg.content, false);
            });
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function saveKeys() {
            localStorage.setItem('key_openai', document.getElementById('keyOpenAI').value);
            localStorage.setItem('key_claude', document.getElementById('keyClaude').value);
            localStorage.setItem('key_gemini', document.getElementById('keyGemini').value);
            toggleSettings();
            alert("¡Llaves guardadas correctamente en tu dispositivo!");
        }

        function appendMessageUI(sender, text, save = true) {
            const chatContainer = document.getElementById('chatContainer');
            const isUser = sender === 'user';

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${isUser ? 'from-slate-700 to-slate-600' : 'from-natsuneBlue to-natsuneSky'} flex-shrink-0 flex items-center justify-center text-xs font-bold text-white shadow-md">
                    ${isUser ? 'U' : 'N'}
                </div>
                <div class="bg-natsuneCard border border-slate-800 p-4 rounded-2xl text-sm text-slate-200 shadow-xl max-w-xl">
                    <p class="whitespace-pre-wrap">${text}</p>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save) {
                const history = JSON.parse(localStorage.getItem('natsune_history') || '[]');
                history.push({ role: sender, content: text });
                localStorage.setItem('natsune_history', JSON.stringify(history));
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessageUI('user', text);

            const model = document.getElementById('modelSelector').value;
            
            // Simulación o respuesta inteligente local si no hay API Key configurada
            if (model === 'natsune') {
                setTimeout(() => {
                    const response = `Entendido. Analizando tu petición con Natsune Core basada en tus interacciones previas: "${text}". ¿Te gustaría profundizar en esto o cambiar de modelo en la barra superior?`;
                    appendMessageUI('natsune', response);
                }, 600);
                return;
            }

            // Llamada real si el usuario configuró su llave para el modelo seleccionado
            const apiKey = localStorage.getItem(`key_${model === 'chatgpt' ? 'openai' : model === 'claude' ? 'claude' : 'gemini'}`);
            
            if (!apiKey) {
                appendMessageUI('natsune', `⚠️ No has configurado la llave API para este modelo (${model}). Toca el ícono de engranaje ⚙️ arriba a la derecha para ingresarla.`);
                return;
            }

            appendMessageUI('natsune', 'Procesando con ' + model.toUpperCase() + '...');
            // Aquí puedes conectar el fetch correspondiente a la API respectiva de forma totalmente directa.
        }

        // Enviar con tecla Enter
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
